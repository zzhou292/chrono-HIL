# SCM Terrain Configuration: Muddy Ruts
# =========================================
# Wet clay with deep ruts and uneven surface.
# High sinkage on soft ground with sharp terrain features.

# Bekker pressure-sinkage parameters (wet clay)
Kphi: 692200
Kc: 13200
n: 0.5

# Mohr-Coulomb shear strength parameters
cohesion: 4140
friction_angle: 13    # Low friction — slippery (degrees)

# Janosi shear displacement parameter
janosi_shear: 0.01

# Contact parameters
elastic_stiffness: 2.0e8
damping: 3.0e4

# Terrain topology (Perlin noise bumpiness)
bump_amplitude: 0.18  # Deep rut-like features (m)
bump_wavelength: 8.0  # Short wavelength — frequent ruts (m)
bump_octaves: 5       # High detail for rut-like texture
bump_max_slope: 0.3   # Steep rut walls (30% grade)
