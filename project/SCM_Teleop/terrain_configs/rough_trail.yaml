# SCM Terrain Configuration: Rough Trail
# ==========================================
# Rough unpaved trail with significant terrain variation.
# Tests vehicle stability and controller robustness.

# Bekker pressure-sinkage parameters (loose sandy soil)
Kphi: 1523400
Kc: 900
n: 1.1

# Mohr-Coulomb shear strength parameters
cohesion: 1000
friction_angle: 30

# Janosi shear displacement parameter
janosi_shear: 0.025

# Contact parameters
elastic_stiffness: 2.0e8
damping: 3.0e4

# Terrain topology (Perlin noise bumpiness)
bump_amplitude: 0.2   # Significant bumps (m)
bump_wavelength: 10.0 # Closely spaced features (m)
bump_octaves: 4       # Good detail
bump_max_slope: 0.25  # Moderate-steep slopes (25% grade)
