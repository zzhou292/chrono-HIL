# SCM Terrain Configuration: Training Data Mean
# ==============================================
# Parameters at the mean of the NN training data distribution
# Use this for best NN model accuracy (within training distribution)

# Training data ranges:
# - Kphi: 2.0e6 - 4.0e6 (mean: 3.0e6)
# - Kc: 0 - 10000 (mean: 5000)
# - n: 1.0 - 1.4 (mean: 1.2)
# - cohesion: 0 - 5000 (mean: 2500)
# - friction: 25 - 45 deg (mean: 35)
# - janosi: 0.01 - 0.05 (mean: 0.03)

# Bekker pressure-sinkage parameters
Kphi: 3.0e6           # Mean of training range
Kc: 5000              # Mean of training range
n: 1.2                # Mean of training range

# Mohr-Coulomb shear strength parameters  
cohesion: 2500        # Mean of training range
friction_angle: 35    # Mean of training range

# Janosi shear displacement parameter
janosi_shear: 0.03    # Mean of training range

# Optional parameters
elastic_stiffness: 2.0e8
damping: 3.0e4
length: 50.0
width: 100.0
mesh_resolution: 0.05
