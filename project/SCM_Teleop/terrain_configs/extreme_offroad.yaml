# SCM Terrain Configuration: Extreme Off-Road
# ================================================
# Maximum difficulty: soft soil + aggressive terrain features.
# Combines deep sinkage with large elevation changes and steep slopes.
# Stress-tests vehicle dynamics, controller, and safety systems.

# Bekker pressure-sinkage parameters (very soft, loose soil)
Kphi: 600000          # Very low stiffness — deep sinkage (Pa/m^n)
Kc: 1000              # Low cohesion (Pa/m^(n-1))
n: 1.3                # Maximum sinkage exponent — near NN training limit

# Mohr-Coulomb shear strength parameters
cohesion: 800         # Minimal cohesion (Pa)
friction_angle: 22    # Low friction — poor traction (degrees)

# Janosi shear displacement parameter
janosi_shear: 0.024

# Contact parameters
elastic_stiffness: 2.0e8
damping: 3.0e4

# Terrain topology (Perlin noise bumpiness)
bump_amplitude: 0.35  # Very large terrain features (m)
bump_wavelength: 7.0  # Short wavelength — frequent obstacles (m)
bump_octaves: 6       # Very detailed fractal terrain
bump_max_slope: 0.4   # Very steep slopes (40% grade)
