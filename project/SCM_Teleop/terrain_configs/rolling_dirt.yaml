# SCM Terrain Configuration: Rolling Dirt Road
# ===============================================
# Moderately uneven dirt road with gentle hills.
# Typical of maintained off-road trails.

# Bekker pressure-sinkage parameters (sandy loam — same as dirt.yaml base)
Kphi: 1515000
Kc: 5300
n: 0.7

# Mohr-Coulomb shear strength parameters
cohesion: 1700
friction_angle: 29

# Janosi shear displacement parameter
janosi_shear: 0.025

# Contact parameters
elastic_stiffness: 2.0e8
damping: 3.0e4

# Terrain topology (Perlin noise bumpiness)
bump_amplitude: 0.08  # Noticeable undulations (m)
bump_wavelength: 18.0 # Moderate wavelength (m)
bump_octaves: 3       # Some fine detail
bump_max_slope: 0.15  # Mild slopes (15% grade)
