# SCM Terrain Configuration: Washboard Road
# =============================================
# Characteristic washboard corrugations on dry dirt road.
# Periodic short-wavelength bumps that excite suspension resonance.

# Bekker pressure-sinkage parameters (hard-packed dry dirt)
Kphi: 2000000
Kc: 6000
n: 0.8

# Mohr-Coulomb shear strength parameters
cohesion: 2500
friction_angle: 31

# Janosi shear displacement parameter
janosi_shear: 0.022

# Contact parameters
elastic_stiffness: 2.0e8
damping: 3.0e4

# Terrain topology (Perlin noise bumpiness)
bump_amplitude: 0.12  # Moderate corrugation depth (m)
bump_wavelength: 5.0  # Very short wavelength — rapid washboard (m)
bump_octaves: 2       # Low octaves — periodic not fractal
bump_max_slope: 0.25  # Moderately steep corrugation faces
