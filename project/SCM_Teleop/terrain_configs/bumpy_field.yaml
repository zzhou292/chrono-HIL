# SCM Terrain Configuration: Bumpy Field
# ==========================================
# Agricultural field with moderate bumps and ruts.
# Challenges the suspension and controller tracking.

# Bekker pressure-sinkage parameters (moist agricultural soil)
Kphi: 1200000
Kc: 7500
n: 0.6

# Mohr-Coulomb shear strength parameters
cohesion: 3200        # Good cohesion from moisture (Pa)
friction_angle: 25    # Moderate friction (degrees)

# Janosi shear displacement parameter
janosi_shear: 0.018

# Contact parameters
elastic_stiffness: 2.0e8
damping: 3.0e4

# Terrain topology (Perlin noise bumpiness)
bump_amplitude: 0.15  # Noticeable bumps (m)
bump_wavelength: 12.0 # Shorter wavelength — more frequent bumps (m)
bump_octaves: 4       # Moderate detail and sub-features
bump_max_slope: 0.2   # Moderate slopes (20% grade)
