# SCM Terrain Configuration: Smooth Road
# =========================================
# Flat, hard-packed surface — minimal deformation.
# Good for baseline testing and high-speed driving.

# Bekker pressure-sinkage parameters (hard-packed sandy loam)
Kphi: 3500000         # High friction modulus — very stiff ground (Pa/m^n)
Kc: 12000             # Moderate cohesion modulus (Pa/m^(n-1))
n: 0.4                # Low sinkage exponent — resists penetration

# Mohr-Coulomb shear strength parameters
cohesion: 8000        # High cohesion (Pa)
friction_angle: 35    # High friction angle (degrees)

# Janosi shear displacement parameter
janosi_shear: 0.02    # Shear displacement coefficient (m)

# Contact parameters
elastic_stiffness: 2.0e8
damping: 3.0e4

# Terrain topology (Perlin noise bumpiness)
bump_amplitude: 0.0   # Perfectly flat (m)
bump_wavelength: 20.0  # N/A for flat terrain (m)
bump_octaves: 1        # Minimal noise layers
bump_max_slope: 0.1    # N/A for flat terrain
