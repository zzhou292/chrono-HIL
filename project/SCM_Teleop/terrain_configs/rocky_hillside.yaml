# SCM Terrain Configuration: Rocky Hillside
# =============================================
# Hard rocky terrain with steep inclines and rough surface.
# Extreme suspension travel and traction challenges.

# Bekker pressure-sinkage parameters (rocky/gravelly)
Kphi: 3200000         # Very stiff ground (Pa/m^n)
Kc: 15000             # High cohesion — compacted rock/gravel (Pa/m^(n-1))
n: 0.35               # Very low sinkage — hard surface

# Mohr-Coulomb shear strength parameters
cohesion: 10000       # High cohesion (Pa)
friction_angle: 36    # High friction (degrees)

# Janosi shear displacement parameter
janosi_shear: 0.015

# Contact parameters
elastic_stiffness: 2.0e8
damping: 3.0e4

# Terrain topology (Perlin noise bumpiness)
bump_amplitude: 0.3   # Large terrain features (m)
bump_wavelength: 8.0  # Closely spaced rocky features (m)
bump_octaves: 6       # Very detailed — rough rocky texture
bump_max_slope: 0.35  # Steep slopes (35% grade)
