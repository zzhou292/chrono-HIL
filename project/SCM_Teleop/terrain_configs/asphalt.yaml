# SCM Terrain Configuration: Asphalt
# ====================================
# Hard asphalt/paved surface - very high stiffness, minimal sinkage

# Bekker pressure-sinkage parameters
Kphi: 5.0e6           # Friction modulus (Pa/m^n) - high for hard surface
Kc: 3000              # Cohesion modulus (Pa/m^(n-1))
n: 1.1                # Sinkage exponent

# Mohr-Coulomb shear strength parameters
cohesion: 1000        # Soil cohesion (Pa)
friction_angle: 35    # Internal friction angle (degrees)

# Janosi shear displacement parameter
janosi_shear: 0.01    # Shear displacement coefficient (m)

# Contact parameters
elastic_stiffness: 2.0e8   # Contact stiffness (N/m)
damping: 3.0e4             # Contact damping (Ns/m)
