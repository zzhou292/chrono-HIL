# SCM Terrain Configuration: Sand
# ================================
# Dry sand - low cohesion, high friction, deep sinkage

# Bekker pressure-sinkage parameters
Kphi: 2.1e6           # Friction modulus (Pa/m^n)
Kc: 500               # Cohesion modulus (Pa/m^(n-1))
n: 1.38               # Sinkage exponent

# Mohr-Coulomb shear strength parameters
cohesion: 300         # Soil cohesion (Pa)
friction_angle: 30    # Internal friction angle (degrees)

# Janosi shear displacement parameter
janosi_shear: 0.048   # Shear displacement coefficient (m)

# Contact parameters
elastic_stiffness: 2.0e8   # Contact stiffness (N/m)
damping: 3.0e4             # Contact damping (Ns/m)
