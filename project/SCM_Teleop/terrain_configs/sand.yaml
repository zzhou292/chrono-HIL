# SCM Terrain Configuration: Dry Sand
# ====================================
# Literature values for dry sand (Wong, Bekker)

# Bekker pressure-sinkage parameters
Kphi: 1523400         # Friction modulus (Pa/m^n) — 1523.4 kPa/m^n
Kc: 900               # Cohesion modulus (Pa/m^(n-1)) — 0.9 kPa/m^(n-1)
n: 1.1                # Sinkage exponent

# Mohr-Coulomb shear strength parameters
cohesion: 1000        # Soil cohesion (Pa) — 1.0 kPa
friction_angle: 30    # Internal friction angle (degrees)

# Janosi shear displacement parameter
janosi_shear: 0.025   # Shear displacement coefficient (m)

# Contact parameters
elastic_stiffness: 2.0e8   # Contact stiffness (N/m)
damping: 3.0e4             # Contact damping (Ns/m)
