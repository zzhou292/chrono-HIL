# SCM Terrain Configuration: Gentle Gravel Road
# ================================================
# Slightly uneven compacted gravel surface.
# Mild disturbances — suitable for tuning controllers.

# Bekker pressure-sinkage parameters (compacted gravel)
Kphi: 2800000         # Stiff ground (Pa/m^n)
Kc: 8000              # Moderate cohesion (Pa/m^(n-1))
n: 0.5                # Low-moderate sinkage exponent

# Mohr-Coulomb shear strength parameters
cohesion: 5000        # Good cohesion (Pa)
friction_angle: 33    # High friction angle (degrees)

# Janosi shear displacement parameter
janosi_shear: 0.022

# Contact parameters
elastic_stiffness: 2.0e8
damping: 3.0e4

# Terrain topology (Perlin noise bumpiness)
bump_amplitude: 0.03  # Very gentle undulations (m)
bump_wavelength: 25.0 # Long wavelength — smooth rolls (m)
bump_octaves: 2       # Minimal detail
bump_max_slope: 0.1   # Very gentle slopes
