# SCM Terrain Configuration: Clayey Soil
# ========================================
# Literature values for clayey soil (Wong, Bekker)

# Bekker pressure-sinkage parameters
Kphi: 692200          # Friction modulus (Pa/m^n) — 692.2 kPa/m^n
Kc: 13200             # Cohesion modulus (Pa/m^(n-1)) — 13.2 kPa/m^(n-1)
n: 0.5                # Sinkage exponent

# Mohr-Coulomb shear strength parameters
cohesion: 4140        # Soil cohesion (Pa) — 4.14 kPa
friction_angle: 13    # Internal friction angle (degrees)

# Janosi shear displacement parameter
janosi_shear: 0.01    # Shear displacement coefficient (m)

# Contact parameters
elastic_stiffness: 2.0e8   # Contact stiffness (N/m)
damping: 3.0e4             # Contact damping (Ns/m)
