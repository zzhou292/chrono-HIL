# SCM Terrain Configuration: Dirt
# ================================
# Packed dirt/gravel - moderate cohesion and friction

# Bekker pressure-sinkage parameters
Kphi: 3.5e6           # Friction modulus (Pa/m^n)
Kc: 2000              # Cohesion modulus (Pa/m^(n-1))
n: 1.1                # Sinkage exponent

# Mohr-Coulomb shear strength parameters
cohesion: 800         # Soil cohesion (Pa)
friction_angle: 32    # Internal friction angle (degrees)

# Janosi shear displacement parameter
janosi_shear: 0.02    # Shear displacement coefficient (m)

# Contact parameters
elastic_stiffness: 2.0e8   # Contact stiffness (N/m)
damping: 3.0e4             # Contact damping (Ns/m)
