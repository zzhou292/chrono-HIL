# SCM Terrain Configuration: Sandy Loam
# =======================================
# Literature values for sandy loam (Wong, Bekker)

# Bekker pressure-sinkage parameters
Kphi: 1515000         # Friction modulus (Pa/m^n) — 1515.0 kPa/m^n
Kc: 5300              # Cohesion modulus (Pa/m^(n-1)) — 5.3 kPa/m^(n-1)
n: 0.7                # Sinkage exponent

# Mohr-Coulomb shear strength parameters
cohesion: 1700        # Soil cohesion (Pa) — 1.7 kPa
friction_angle: 29    # Internal friction angle (degrees)

# Janosi shear displacement parameter
janosi_shear: 0.025   # Shear displacement coefficient (m)

# Contact parameters
elastic_stiffness: 2.0e8   # Contact stiffness (N/m)
damping: 3.0e4             # Contact damping (Ns/m)
